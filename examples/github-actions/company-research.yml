name: ReplyNodes company research
on:
  workflow_dispatch:
    inputs:
      domain:
        description: Public company domain
        required: true
        default: stripe.com
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Install once in the agent environment:
      # npx --yes skills add https://github.com/replynodes/replynodes-agent-skills/tree/main/skills/company-research
      # Source: https://github.com/replynodes/replynodes-agent-skills
      # Focused page: https://www.skills.sh/replynodes/replynodes-agent-skills/company-research
      - name: Read public evidence
        env:
          DOMAIN: ${{ inputs.domain }}
        run: |
          set -euo pipefail
          curl --fail-with-body --max-time 20 "https://md.replynodes.com/https://${DOMAIN}/" -o company.md
          curl --fail-with-body --max-time 20 "https://brand.replynodes.com/${DOMAIN}.json" -o brand.json
      - uses: actions/upload-artifact@v4
        with:
          name: company-research-evidence
          path: |
            company.md
            brand.json
