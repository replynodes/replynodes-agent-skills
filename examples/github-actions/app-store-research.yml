name: ReplyNodes App Store research
on:
  workflow_dispatch:
    inputs:
      term:
        description: Public iOS app search term
        required: true
        default: notion
permissions:
  contents: read
jobs:
  app-store:
    runs-on: ubuntu-latest
    steps:
      - name: Install canonical app-store-api skill
        run: npx --yes skills add https://github.com/replynodes/replynodes-agent-skills --skill app-store-api --full-depth
      - name: Search public App Store data
        env:
          TERM: ${{ inputs.term }}
        run: |
          set -euo pipefail
          curl --fail-with-body --max-time 20 --get 'https://api.replynodes.com/v1/appstore/search' \
            --data-urlencode "term=${TERM}" --data 'country=us' --data 'num=1' -o appstore.json
      - uses: actions/upload-artifact@v4
        with:
          name: app-store-research
          path: appstore.json
